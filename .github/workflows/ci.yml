name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # P0.94. The pre-commit hook only formats files that are STAGED, so a
      # file already dirty when the hook landed stays dirty forever. This is
      # the repo-wide check that catches that class rather than fixing it once.
      - name: Format
        run: pnpm format:check

      - name: Import boundaries
        run: pnpm lint:deps

      - name: Test
        run: pnpm test

      # P7.11. A named, hard-failing gate rather than 19 tests among 3817.
      # `pnpm test` already runs this file; the separate step exists so that a
      # backend divergence is legible as its own red step in the run summary
      # instead of a line inside a 315-file report, and so the criterion has a
      # single command a human can run.
      #
      # NOT a soft warn, unlike the three benchmarks below it. Those measure
      # timings on a shared runner, where a noisy neighbour is not a defect.
      # This one asserts bit-identity between backends and against a committed
      # golden, which is either true or is a bug.
      #
      # This is also the step that covers what `wasm-artifact-freshness.test.ts`
      # cannot here: there is no Rust toolchain on this runner, so its
      # byte-identity checks skip, and a stale `.wasm` would otherwise be
      # compared against goldens generated from source that no longer exists.
      # The golden records the crate's own source hashes, so an unrebuilt crate
      # edit fails here without a compiler.
      - name: Backend equivalence (TS vs WASM golden)
        run: pnpm check:backend-equivalence

      - name: Benchmark regression check (soft warn)
        run: pnpm bench:solverkit

      # P6.26. Soft warn, like the two perf checks around it: absolute
      # throughput on a shared runner is not a signal a build should be gated
      # on, and a perf gate that fails for a noisy neighbour trains everyone
      # to re-run until it passes. The uploaded artifact is the deliverable
      # the task's criterion names; the exit code is not the evidence.
      #
      # No --record. The write would land in the runner's workspace and be
      # discarded (same as the drift check before P0.102 made that explicit),
      # and the committed scripts/batch-throughput-results.json is meant to
      # be a deliberate local act. The artifact below carries the CI numbers.
      - name: Batch throughput benchmark (soft warn)
        run: pnpm bench:throughput | tee batch-throughput-ci.json.log

      - name: Upload batch throughput artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-throughput
          path: batch-throughput-ci.json.log
          if-no-files-found: warn

      - name: Cross-engine drift check (soft warn)
        # --record here because this is the one environment with real browsers,
        # so it is the only place the recording path gets exercised at all --
        # an untested write path would rot silently. Note the write lands in
        # the runner's workspace and is discarded: nothing commits it back, and
        # nothing did before P0.102 either. Refreshing the committed
        # scripts/cross-engine-drift-results.json is still a deliberate act —
        # run with --record locally and commit the result.
        # Without the flag the script measures and reports but writes nothing
        # (P0.102), which is what a local pre-push gate run should do.
        run: pnpm check:cross-engine-drift --record

      # P7.15. A real gate, and the evidence that it is one was gathered before
      # this step was added -- which is the 98th run's lesson applied rather
      # than restated, since that run's CI went red from adding a step that had
      # not been run where it would run.
      #
      # `.github/workflows/gpu-adapter-probe.yml` (dispatch-only) ran the script
      # on an ubuntu-latest runner on 2026-09-13, run 34778378056. It probed two
      # legs, expecting the bare launch to find nothing because Playwright
      # resolves `chromium_headless_shell` and the headless shell does not ship
      # the GPU process WebGPU needs.
      #
      # **That expectation was wrong.** The bare `pnpm check:gpu-rk4-agreement`
      # -- exactly this invocation -- obtained a SwiftShader adapter (vendor
      # google, architecture swiftshader, Chromium 149.0.7827.55) and reported
      # 10000/10000 trajectories bit-identical, 0 ULP. The explicit
      # full-Chromium leg agreed. Step cost was ~7 s, of which ~6 s is the f32
      # CPU reference under Node and ~1 s is the browser.
      #
      # HARD, not a soft warn, for the reason the backend-equivalence step
      # above gives: this asserts numerical agreement against a budget, which
      # is either true or is a bug, unlike the three timing benchmarks whose
      # numbers move with a noisy neighbour. It degrades correctly if a future
      # runner image drops the adapter -- the script warns and exits 0 rather
      # than reporting an all-clear it did not measure (P0.102).
      #
      # NOT `--record`: the write would land in the runner's workspace and be
      # discarded, and refreshing the committed results file is meant to be a
      # deliberate local act. Same position as the throughput step.
      #
      # The P7.15 workgroup sweep (`pnpm bench:gpu-workgroup`) is deliberately
      # NOT here. It is a timing benchmark, and a workgroup ranking measured on
      # a shared runner's software adapter would be noise wearing a result's
      # name -- its own measurement in this container could not separate its
      # top two sizes on a quiet machine.
      - name: GPU/CPU kernel agreement (WGSL RK4)
        run: pnpm check:gpu-rk4-agreement

      # P7.16, and a hard gate for exactly the reason the step above is one:
      # it asserts numerical agreement against a budget, which is either true
      # or is a bug. It shares that step's degradation behaviour too -- no
      # adapter means a warning and exit 0, never an all-clear derived from
      # nothing measured (P0.102).
      #
      # Added on the strength of the run above rather than on a fresh probe.
      # That is a weaker warrant than P7.15 had and it is stated rather than
      # glossed: the two scripts launch the same Chromium the same way, with
      # the same flag sets and the same secure-context server, and differ only
      # in which shader they dispatch and how many steps they march. What is
      # genuinely untested on a runner is the cost. The CPU reduction under
      # Node took 43 s locally for 10000 trajectories at 12000 steps -- six
      # times the RK4 step's ~7 s, because it marches six times as far -- so
      # this step is expected to be the slowest in the job by some margin. If
      # that proves intolerable on a runner the fix is to cut the ensemble for
      # CI and keep the 1e4 run local, NOT to drop the gate.
      - name: GPU/CPU observables agreement (WGSL reduction)
        run: pnpm check:gpu-observables

      - name: Engine API docs
        run: pnpm --filter @ballista/engine run docs

      - name: SolverKit API docs
        run: pnpm --filter @ballista/solverkit run docs

      - name: Build app
        run: pnpm --filter @ballista/app build

      - name: Bundle size budget
        run: pnpm --filter @ballista/app check-bundle-size
